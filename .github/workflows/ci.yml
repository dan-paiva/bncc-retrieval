name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Só o núcleo + o SDK da Anthropic: os testes do LLM usam cliente falso, sem rede nem chave.
      - run: pip install -e ".[llm,dev]"
      - run: ruff check .
      - run: pytest -q
